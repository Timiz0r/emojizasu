[package]
name = "emojizasu-imd"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# Builds the isolated test addon: different D-Bus name + recent.json path.
test-variant = []

[dependencies]
zbus       = { version = "4", default-features = false, features = ["tokio"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
libc       = "0.2"

[build-dependencies]
cc         = "1"
pkg-config = "0.3"
